extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  awsxray:
    region: ${env:AWS_REGION}

  awsemf:
    region: ${env:AWS_REGION}
    namespace: AuthenticationProject
    log_group_name: /authentication-project/metrics
    log_stream_name: authentication-api
    dimension_rollup_option: NoDimensionRollup
    retain_initial_value_of_delta_metric: true
    metric_declarations:
      - dimensions: [[http.method]]
        metric_name_selectors:
          - ^http\.server\.active_requests$
      - dimensions: [[http.method, http.status_code]]
        metric_name_selectors:
          - ^http\.server\.(duration|request\.size|response\.size)$
      - dimensions: [[state]]
        metric_name_selectors:
          - ^db\.client\.connections\.usage$

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [awsemf]
