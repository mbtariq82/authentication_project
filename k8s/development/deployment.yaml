apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: auth-development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: 651980295854.dkr.ecr.eu-west-2.amazonaws.com/auth-fastapi:eaa9b3f
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: fastapi-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: auth-development
spec:
  type: ClusterIP
  selector:
    app: fastapi
  ports:
    - port: 80
      targetPort: 8000