name: Build and deploy FastAPI

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "k8s/deployment.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auth-development-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "651980295854"
  ECR_REPOSITORY: auth-fastapi
  ECR_REGISTRY: 651980295854.dkr.ecr.eu-west-2.amazonaws.com
  EKS_CLUSTER: authentication-project
  K8S_NAMESPACE: auth-development
  DEPLOYMENT_FILE: k8s/deployment.yaml

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Validate SQLAlchemy mappings
        working-directory: backend
        run: |
          python -c "import models; from sqlalchemy.orm import configure_mappers; configure_mappers()"

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests/unit

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define immutable image address
        shell: bash
        run: |
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        shell: bash
        run: |
          docker build \
            --pull \
            --tag "$IMAGE_URI" \
            backend

          docker push "$IMAGE_URI"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.35.0"

      - name: Update deployment image
        shell: bash
        run: |
          python <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["DEPLOYMENT_FILE"])
          contents = path.read_text(encoding="utf-8")

          repository = (
              f"{os.environ['ECR_REGISTRY']}/"
              f"{os.environ['ECR_REPOSITORY']}"
          )

          pattern = re.compile(
              rf"^(\s*image:\s*){re.escape(repository)}:\S+$",
              re.MULTILINE,
          )

          updated, replacements = pattern.subn(
              rf"\g<1>{os.environ['IMAGE_URI']}",
              contents,
          )

          if replacements != 1:
              raise SystemExit(
                  f"Expected to replace one image, replaced {replacements}"
              )

          path.write_text(updated, encoding="utf-8")
          PY

          grep -F "image: ${IMAGE_URI}" "$DEPLOYMENT_FILE"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Confirm workers are available
        shell: bash
        run: |
          READY_NODES="$(
            kubectl get nodes --no-headers |
            awk '$2 == "Ready" { count++ } END { print count + 0 }'
          )"

          if [ "$READY_NODES" -lt 1 ]; then
            echo "::error::No Ready EKS worker nodes are available."
            exit 1
          fi

      - name: Apply Kubernetes deployment
        run: |
          kubectl apply \
            --filename "$DEPLOYMENT_FILE" \
            --namespace "$K8S_NAMESPACE"

      - name: Wait for FastAPI rollout
        run: |
          kubectl rollout status deployment/fastapi \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Show deployed image
        run: |
          kubectl get deployment fastapi \
            --namespace "$K8S_NAMESPACE" \
            --output=jsonpath='{.spec.template.spec.containers[?(@.name=="fastapi")].image}'

          echo
