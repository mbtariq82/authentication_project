name: Test and deploy application

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auth-development-deployment
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "651980295854"

  ECR_REPOSITORY: auth-fastapi
  ECR_REGISTRY: 651980295854.dkr.ecr.eu-west-2.amazonaws.com

  FRONTEND_BUCKET: authentication-project-frontend-651980295854
  PROFILE_IMAGES_BUCKET: authentication-project-profile-images-651980295854

  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

jobs:
  # ============================================================
  # BACKEND UNIT TESTS
  # ============================================================

  unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: github-actions-test-secret
      GOOGLE_CLIENT_ID: github-actions-test-client
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Validate SQLAlchemy mappings
        working-directory: backend
        run: |
          python -c "import models; from sqlalchemy.orm import configure_mappers; configure_mappers()"

      - name: Run unit tests
        working-directory: backend
        run: python -m pytest tests/unit

  # ============================================================
  # BACKEND DEPLOYMENT
  # ============================================================

  backend-deploy:
    name: Deploy backend to EC2
    needs: unit-tests

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Define immutable image address
        shell: bash
        run: |
          echo "IMAGE_URI=${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build and push image
        shell: bash
        run: |
          docker build \
            --pull \
            --tag "$IMAGE_URI" \
            backend

          docker push "$IMAGE_URI"

      - name: Deploy image to EC2
        shell: bash
        run: |
          if [ -z "$EC2_INSTANCE_ID" ]; then
            echo "::error::EC2_INSTANCE_ID repository variable is not set."
            exit 1
          fi

          jq --null-input \
            --arg image_uri "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg profile_images_bucket "$PROFILE_IMAGES_BUCKET" \
            '{
              commands: [
                "set -euo pipefail",
                "test -s /opt/authentication-project/.env",
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                ("docker pull " + $image_uri),
                "docker rm --force fastapi 2>/dev/null || true",
                ("docker run --detach --name fastapi --restart unless-stopped --env-file /opt/authentication-project/.env --env PROFILE_IMAGE_STORAGE_BACKEND=s3 --env PROFILE_IMAGES_BUCKET=" + $profile_images_bucket + " --env AWS_REGION=" + $region + " --env OTEL_SDK_DISABLED=true --publish 8000:8000 " + $image_uri),
                "docker image prune --force",
                "sleep 5",
                "curl --fail --silent --show-error http://localhost:8000/health"
              ]
            }' > ssm-parameters.json

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --parameters file://ssm-parameters.json \
              --timeout-seconds 300 \
              --comment "Deploy FastAPI ${GITHUB_SHA}" \
              --query 'Command.CommandId' \
              --output text
          )"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

  # ============================================================
  # FRONTEND DEPLOYMENT
  # ============================================================

  frontend-deploy:
    name: Deploy frontend to S3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: bun run build

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: GitHubActions-Frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Upload frontend build to S3
        shell: bash
        run: |
          aws s3 sync \
            frontend/dist/ \
            "s3://${FRONTEND_BUCKET}/" \
            --delete